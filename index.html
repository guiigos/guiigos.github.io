<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Em breve</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Helvetica Neue", Arial, sans-serif;
      --text: #f8fafc;
      --soft: rgba(248, 250, 252, 0.72);
      --quiet: rgba(248, 250, 252, 0.5);
      --line: rgba(248, 250, 252, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        linear-gradient(90deg, rgba(4, 10, 22, 0.88), rgba(4, 10, 22, 0.56) 52%, rgba(4, 10, 22, 0.22)),
        linear-gradient(180deg, rgba(4, 10, 22, 0.2), rgba(4, 10, 22, 0.74)),
        url("img/background-min.jpg") center / cover no-repeat;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: clamp(28px, 6vw, 80px);
    }

    .content {
      width: min(100%, 680px);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: clamp(28px, 5vw, 48px);
      color: var(--quiet);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .status::before {
      content: "";
      width: 44px;
      height: 1px;
      background: var(--line);
    }

    h1 {
      max-width: 11ch;
      margin: 0;
      font-size: clamp(3.75rem, 13vw, 8.5rem);
      font-weight: 300;
      line-height: 0.9;
      letter-spacing: 0;
    }

    p {
      max-width: 520px;
      margin: clamp(28px, 5vw, 40px) 0 0;
      color: var(--soft);
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      font-weight: 300;
      line-height: 1.7;
    }

    .signature {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: clamp(44px, 7vw, 72px);
      color: var(--quiet);
      font-size: 0.84rem;
    }

    .signature::before {
      content: "";
      width: 72px;
      height: 1px;
      background: var(--line);
    }

    @media (max-width: 720px) {
      body {
        background:
          linear-gradient(180deg, rgba(4, 10, 22, 0.68), rgba(4, 10, 22, 0.9)),
          url("img/background-min.jpg") center / cover no-repeat;
      }

      main {
        align-items: flex-end;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <section class="content">
      <div class="status">site em construcao</div>
      <h1 id="page-title">Em breve.</h1>
      <p>Estamos redesenhando esta experiencia com mais cuidado, clareza e atencao aos detalhes.</p>
      <div class="signature">voltamos logo</div>
    </section>
  </main>
</body>
</html>
